<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>Page not found — Jordan Monnet</title>
<link rel="icon" href="/media/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100svh;
    margin: 0;
    padding: 32px;
    display: grid;
    place-items: center;
    background: #ffffff;
    color: #0f1f3d;
    font-family: 'Manrope', sans-serif;
  }
  main { width: min(100%, 680px); text-align: center; }
  .code {
    margin: 0 0 20px;
    color: #2a4a8a;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    font-family: 'Manrope', sans-serif;
    font-size: clamp(48px, 9vw, 82px);
    font-weight: 500;
    letter-spacing: -0.065em;
    line-height: 1;
  }
  h1 em { color: #2a4a8a; font-style: normal; font-weight: 500; }
  p { margin: 28px auto 0; color: #6b7280; font-size: 15px; line-height: 1.7; }
  a {
    display: inline-block;
    margin-top: 30px;
    padding: 13px 20px;
    background: #0f1f3d;
    color: #ffffff;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-decoration: none;
    text-transform: uppercase;
  }
  a:focus-visible { outline: 2px solid #2a4a8a; outline-offset: 4px; }
</style>
</head>
<body>
  <main>
    <p class="code">404 · Page not found</p>
    <h1>This page took a <em>different path.</em></h1>
    <p>The address may have changed, or the page may no longer exist.</p>
    <a href="/">Return home</a>
  </main>
</body>
</html>
