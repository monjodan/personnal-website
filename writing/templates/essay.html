<article class="essay">
  <div class="essay-inner">
    <header>
      <p class="eyebrow reveal"><a href="/writing/">Writing</a></p>
      <h1 class="essay-title reveal">{{title}}</h1>
      <p class="essay-meta reveal"><time datetime="{{iso_date}}">{{date}}</time></p>
      <figure class="essay-lead reveal"><img src="{{lead}}" alt="{{alt}}" width="1600" height="900" fetchpriority="high"></figure>
    </header>
    <div class="essay-text">
{{body}}
    </div>
    <div class="essay-foot">
      <a class="back-link" href="/writing/">All essays</a>
      <span class="essay-sign">Jordan Monnet · Seoul</span>
    </div>
  </div>
</article>
